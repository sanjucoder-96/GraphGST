[pytest]
# Suppress unknown-mark warnings by registering our custom marks.
markers =
    slow: tests that run a subprocess or full pipeline (still run by default;
        exclude with `-m 'not slow'`).
    neo4j: LIVE Neo4j integration tests. Deselected by default (they hit and
        wipe a real database). Run explicitly with `pytest -m neo4j`; they
        self-skip if no reachable Neo4j is configured.
# Unit stage stays fast and DB-free: the live-Neo4j tests are opt-in only.
addopts = -m "not neo4j"
filterwarnings =
    ignore::PendingDeprecationWarning:starlette.formparsers
