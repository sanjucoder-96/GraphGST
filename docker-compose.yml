# Graph GST V6 — one-command local stack.
#   docker compose up --build
#
# Services:
#   - neo4j   : Neo4j 5 Community + APOC + Graph Data Science plugins
#   - backend : FastAPI on :8000
#   - web     : nginx serving the vanilla-JS shell on :3000
#
# The React app that used to live in Hack_Me/src has been dropped — see
# ARCHITECTURE.md § "Frontend consolidation". A single-page investigator
# React app is planned for Phase 6.

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: graphgst-neo4j
    environment:
      NEO4J_AUTH: neo4j/graphgst-dev-password
      # Install both plugins so Phase 3 (SCC via GDS) works out of the box.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt driver
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphgst-dev-password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build: .
    container_name: graphgst-backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: graphgst-dev-password
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      ADMIN_TOKEN: "dev-admin-token-change-in-prod"
      DISTRICT_CODE: KA
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./datagen_output:/app/datagen_output

  # Legacy vanilla-JS shell — kept alive during Phase 6 transition.
  web-legacy:
    image: nginx:alpine
    container_name: graphgst-web-legacy
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./pages:/usr/share/nginx/html/pages:ro
    depends_on:
      - backend

  # Phase 6 — the React Investigator Console. Built at image-build time
  # via `npm run build`; served static via nginx on :5173.
  web:
    build:
      context: ./web
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json* ./
        RUN npm ci --ignore-scripts
        COPY . .
        RUN npm run build
        FROM nginx:alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        RUN printf 'server { listen 80; root /usr/share/nginx/html; \
          try_files $$uri $$uri/ /index.html; \
          location /api/ { proxy_pass http://backend:8000; } \
          }' > /etc/nginx/conf.d/default.conf
    container_name: graphgst-web
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j-data:
  neo4j-logs:
