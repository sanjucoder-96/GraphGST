name: CI

on:
  push:
    branches: [main, tested_one]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Python: unit + integration tests + demo verifier ───────────────────
  pytest:
    name: pytest (unit + demo verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        working-directory: graphgst
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (unit — neo4j integration auto-excluded by pytest.ini)
        working-directory: graphgst
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest tests/ -v --tb=short --durations=10

  # ── Neo4j integration — the REAL persistence path against a live database ─
  # Spins up a disposable Neo4j service container and runs ONLY the `neo4j`-
  # marked tests (CSV → loader → persistence → read-back → rings → risk → API).
  # Kept separate from the fast unit job so unit CI never needs a database.
  neo4j-integration:
    name: neo4j integration (live DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pytest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword12345
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        working-directory: graphgst
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run neo4j integration tests
        working-directory: graphgst
        env:
          PYTHONHASHSEED: "0"
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword12345
          NEO4J_DATABASE: neo4j
        run: |
          python -m pytest tests/test_neo4j_integration.py -m neo4j -v --tb=short

  # ── PR bench (fast) — skip MLScorer + PropagationScorer for ~8s turnaround
  bench-fast:
    name: benchmarks (fast — PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        working-directory: graphgst
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run --fast benchmarks
        working-directory: graphgst
        env:
          PYTHONHASHSEED: "0"
        run: python -m benchmarks.run_all --fast

  # ── main bench (full) — headline metrics vs baseline.json ──────────────
  bench-full:
    name: benchmarks (full — main gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 15
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        working-directory: graphgst
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full benchmarks
        working-directory: graphgst
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m benchmarks.run_all
          echo "=== headlines ==="
          python -c "import json; print(json.dumps(json.load(open('benchmarks/latest.json'))['headlines'], indent=2))"
      - name: Upload latest.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-latest
          path: graphgst/benchmarks/latest.json
          retention-days: 30

  # ── Demo probe — hero ring constants must match datagen output ─────────
  demo-probe:
    name: demo probe (hero constants drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        working-directory: graphgst
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe hero ring
        working-directory: graphgst
        env:
          PYTHONHASHSEED: "0"
        run: python -m demo.probe_hero

  # ── Web: TypeScript strict + Vite production build ────────────────────
  web-build:
    name: web (tsc strict + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: graphgst/web/package-lock.json

      - name: npm ci
        working-directory: graphgst/web
        run: npm ci

      - name: Type-check
        working-directory: graphgst/web
        run: npm run typecheck

      - name: Build
        working-directory: graphgst/web
        run: npm run build

      - name: Upload web dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: graphgst/web/dist
          retention-days: 7
